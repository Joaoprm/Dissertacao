[simulation]
gui = false
total_episodes = 200
max_steps = 3600
n_cars_generated = 2600
n_peds_generated = 1000
green_duration = 8
yellow_duration = 4
scenario = 5


[agent]
num_states = 278
num_actions = 9
n_agents = 9
num_layers = 2
width_layers = 256

[ppo]
# descontos/GAE
gamma = 0.75
gae_lambda = 0.75

# otimizadores
actor_lr = 0.0001
critic_lr = 0.0003

# rollout + treino
horizon = 256
ppo_epochs = 6
minibatch_size = 128

# clipping/entropia/valor
clip_eps = 0.2
ent_coef = 0.005
vf_coef = 0.5

[dir]
models_path_name = models
sumocfg_file_name = sumo_config.sumocfg
